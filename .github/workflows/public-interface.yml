name: Public interface checks
on:
  workflow_run:
    workflows: ["Build and security checks"]
    types: [completed]
  workflow_dispatch:
    inputs:
      check_gemini:
        description: "Periksa pertanyaan buku secara langsung"
        type: boolean
        required: false
        default: true

jobs:
  browser-checks:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: npm ci
      - name: Browser driver
        run: npm install --no-save --ignore-scripts playwright-core@1.56.1
      - name: Verify public controls
        env:
          BIBLIO_CHECK_PERTANYAAN: ${{ github.event_name == 'workflow_dispatch' && inputs.check_gemini && '1' || '0' }}
        run: node tests/public-ui.mjs
