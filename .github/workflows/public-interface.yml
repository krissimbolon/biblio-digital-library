name: Public interface checks
on:
  workflow_run:
    workflows: ["Build and security checks"]
    types: [completed]

jobs:
  browser-checks:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: npm ci
      - name: Browser driver
        run: npm install --no-save --ignore-scripts playwright-core@1.56.1
      - name: Verify public controls
        run: node tests/public-ui.mjs
